# Gateway (http://localhost:8080): as variáveis abaixo são repassadas do seu shell
# para o container (os defaults ficam no gateway/gateway.yaml). Ex.:
#   LB_STRATEGY=ip_hash docker compose up -d gateway
# No PowerShell:
#   $env:LB_STRATEGY="ip_hash"; docker compose up -d gateway
#
services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - db

  api-python:
    build: ./api-python
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/users_db
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  api-node:
    build: ./api-node
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/users_db
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  api-go:
    build: ./api-go
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/users_db
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

  api-rust:
    build: ./api-rust
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/users_db
    ports:
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build: ./gateway
    environment:
      - LB_STRATEGY
      - RATE_LIMIT_ENABLED
      - RATE_LIMIT_RPS
      - RATE_LIMIT_BURST
      - CACHE_ENABLED
      - CACHE_TTL_SECONDS
      - CB_FAILURE_THRESHOLD
      - CB_OPEN_SECONDS
      - HEALTH_CHECK_ENABLED
      - HEALTH_CHECK_INTERVAL_SECONDS
      - PROXY_TIMEOUT_SECONDS
      - PROXY_RETRIES
      - CANARY_WEIGHT
      - CANARY_STABLE_WEIGHT
      - API_PYTHON_LATENCY_MS
      - API_NODE_LATENCY_MS
      - API_GO_LATENCY_MS
      - API_RUST_LATENCY_MS
    ports:
      - "8080:8080"
    depends_on:
      - api-python
      - api-node
      - api-go
      - api-rust
    restart: unless-stopped

volumes:
  db-data:
